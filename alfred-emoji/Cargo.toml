[package]
name = "alfred-emoji"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Alfred emoji grid with keyword search and Jev semantic search"
license = "MIT"

[dependencies]
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

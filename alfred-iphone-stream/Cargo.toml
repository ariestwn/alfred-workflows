[package]
name = "alfred-iphone-stream"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Rust controller for iPhone USB audio streaming in Alfred"
license = "MIT"

[dependencies]
libc = "0.2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

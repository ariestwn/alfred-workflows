[package]
name = "alfred-handy"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Handy speech-to-text controls and searchable history for Alfred"
license = "MIT"

[dependencies]
libc = "0.2"
serde_json = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package]
name = "alfred-my-schedule"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

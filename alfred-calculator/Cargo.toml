[package]
name = "alfred-calculator"
version = "0.1.7"
edition = "2021"
rust-version = "1.85"
description = "Natural-language math, units, currency and dates for Alfred"
license = "MIT"

[dependencies]
fend-core = "=1.5.8"
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
